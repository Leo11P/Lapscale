# Per-stage defaults. Precedence: command-line flag > this file (--config) > built-in default.
calib:
  board:
    target: charuco            # charuco (recommended: partial views count) | checkerboard
    cols: 11                   # charuco: squares per row; checkerboard: INNER corners per row
    rows: 8
    square-mm: null            # MEASURED side of a printed square (never the nominal value)
    marker-mm: null
    dictionary: DICT_5X5_100
    dist-model: standard       # k1k2 | standard | rational
    max-views: 60
    max-candidates: 600
    holdout-fraction: 0.2
  moge:
    moge-version: v2
    n-frames: 20

# Stages 2-4 are configured on the command line (see `lapscale <stage> --help`); only the edge extractor
# and calibration read this file. Recommended starting points:
#   depth   offline: --depth-backend moge --moge-version v3 (Linux/WSL2); real time: v2, moge-2-vits-normal
#   tool    --diameter-mm <measured>, --mc 100 (offline) / 0 (stream)
#   scale   --max-rel-sd 5 --smooth-window 9

tool:
  edges:                       # used by `segbench run --config`; all fields: EdgeConfig in tool/edges.py
    ransac-tol-px: 1.5
    min-span-px: 50
    max-edge-angle-deg: 25
    max-rms-px: 0.8

