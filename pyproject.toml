[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lapscale"
version = "0.1.0"
description = "Metric depth for monocular laparoscopy: camera calibration, MoGe depth, instrument geometry, scale recovery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",   # cv2.aruco (ChArUco) is in the main module since 4.7
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# MoGe-2 works everywhere torch does; MoGe-3 also needs FlexGEMM/Triton (Linux, possibly WSL2).
moge = [
    "torch>=2.1",
    "moge @ git+https://github.com/microsoft/MoGe.git",
]
# SAM 3 and Depth Anything 3 are installed from their repositories (see docs/install.md)
yolo = ["ultralytics>=8.3"]
surgenet = ["torch>=2.1", "timm==1.0.13"]       # + a clone of github.com/TimJaspers0801/SurgeNet
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
lapscale = "lapscale.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/lapscale"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
